services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      uconnect-internal:
        ipv4_address: 192.168.50.2

  api:
    build:
      context: .
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3000
      MONGODB_URI: mongodb://192.168.50.2:27017/uconnect
      CORS_ORIGIN: ${CORS_ORIGIN:-*}
      OLLAMA_HOST: ${OLLAMA_HOST}
      OLLAMA_MODEL: ${OLLAMA_MODEL}
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      OPENAI_VECTOR_STORE_ID: ${OPENAI_VECTOR_STORE_ID}
      FAQ_KB_VECTOR_STORE_FILE_ID: ${FAQ_KB_VECTOR_STORE_FILE_ID}
      AWS_REGION: ${AWS_REGION}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY}
      AWS_SESSION_TOKEN: ${AWS_SESSION_TOKEN}
      TEXTRACT_S3_BUCKET: ${TEXTRACT_S3_BUCKET}
      TEXTRACT_S3_PREFIX: ${TEXTRACT_S3_PREFIX}
      ADMIN_AUTH_MODE: ${ADMIN_AUTH_MODE}
      FIREBASE_SERVICE_ACCOUNT_BASE64: ${FIREBASE_SERVICE_ACCOUNT_BASE64}
      FIREBASE_SERVICE_ACCOUNT_JSON: ${FIREBASE_SERVICE_ACCOUNT_JSON}
      FIREBASE_SERVICE_ACCOUNT_PATH: ${FIREBASE_SERVICE_ACCOUNT_PATH}
      GOOGLE_APPLICATION_CREDENTIALS: ${GOOGLE_APPLICATION_CREDENTIALS}
      ADMIN_EMAIL_ALLOWLIST: ${ADMIN_EMAIL_ALLOWLIST}
      ADMIN_UID_ALLOWLIST: ${ADMIN_UID_ALLOWLIST}
      ADMISION_SIMULADOR_URL: ${ADMISION_SIMULADOR_URL}
      ADMISION_PUNTAJES_URL: ${ADMISION_PUNTAJES_URL}
    depends_on:
      mongo:
        condition: service_healthy
    networks:
      uconnect-internal:
        ipv4_address: 192.168.50.3
      dokploy-network: {}

volumes:
  mongo-data:

networks:
  uconnect-internal:
    driver: bridge
    ipam:
      config:
        - subnet: 192.168.50.0/24
          gateway: 192.168.50.1
  dokploy-network:
    external: true
